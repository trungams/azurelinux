[[group-order]]
name = "first archive occurrence orders groups"
declared = [
  { index = 0, archive = "b.tar.gz", type = "file-remove" },
  { index = 1, archive = "a.tar.xz", type = "file-search-replace" },
  { index = 2, archive = "b.tar.gz", type = "file-search-replace" },
]
expected-groups = [
  { archive = "b.tar.gz", operation-indexes = [0, 2] },
  { archive = "a.tar.xz", operation-indexes = [1] },
]

[[semantic-success]]
name = "single wrapper directory selects inner root"
archive = "pkg.tar.gz"
entries = [
  { path = "pkg-1.0", type = "directory", mode = "0755" },
  { path = "pkg-1.0/remove.txt", type = "file", mode = "0644", content-hex = "78" },
  { path = "pkg-1.0/config.txt", type = "file", mode = "0644", content-hex = "6f6c640a" },
  { path = "pkg-1.0/dir/link", type = "symlink", target = "../config.txt" },
]
operations = [
  { type = "file-remove", file = "remove.txt" },
  { type = "file-search-replace", file = "config.txt", regex = "old", replacement = "new" },
]
expected-entries = [
  { path = "pkg-1.0", type = "directory", mode = "0755", directory-origin = "explicit" },
  { path = "pkg-1.0/config.txt", type = "file", mode = "0644", content-hex = "6e65770a" },
  { path = "pkg-1.0/dir", type = "directory", mode = "0755", directory-origin = "synthesized-required" },
  { path = "pkg-1.0/dir/link", type = "symlink", target = "../config.txt" },
]

