[[metadata-success]]
name = "per-entry PAX path and size override lower-precedence placeholders"
records = [
  { kind = "pax-global", fields = [{ key = "path", value = "global/ignored.txt" }] },
  { kind = "gnu-long-name", value = "gnu/ignored.txt" },
  { kind = "pax-local", fields = [
    { key = "path", value = "pkg/effective.txt" },
    { key = "size", value = "3" },
  ] },
  { kind = "entry", path = "/invalid-placeholder", type = "file", size = 99, mode = "0644", content-hex = "616263" },
]
expected-entries = [
  { path = "pkg/effective.txt", type = "file", size = 3, mode = "0644", content-hex = "616263" },
]

[[metadata-success]]
name = "per-entry PAX link overrides GNU global and base links"
records = [
  { kind = "pax-global", fields = [{ key = "linkpath", value = "/global-invalid" }] },
  { kind = "gnu-long-link", value = "../../gnu-invalid" },
  { kind = "pax-local", fields = [{ key = "linkpath", value = "../target" }] },
  { kind = "entry", path = "pkg/dir/link", type = "symlink", target = "C:/base-invalid", size = 0 },
]
expected-entries = [
  { path = "pkg/dir/link", type = "symlink", target = "../target", size = 0 },
]

