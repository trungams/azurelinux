  "Name: example",
  "%if 0",
  "%ifarch x86_64",
  "Source0: source.tar.gz",
  "%elifnarch aarch64",
  "Source1: alternate.tar.gz",
  "%else",
  "Source2: fallback.tar.gz",
  "%endif",
  "%endif",
  "%description",
  "Example",
]
