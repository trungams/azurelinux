input-lines = ["Name: example", "Patch0: missing.patch"]
input-files = [{ path = "other.patch", mode = "0644", content-hex = "78" }]
outcome = "error"
failure-category = "namespace-agreement"
error = "reference and file sets differ"

[[negative]]
id = "loose-file-destination-collision-error"
family = "loose-file"
operation = { type = "file-add", file = "new.txt", source = "payload/new.txt" }
source-hex = "6e6577"
input-files = [{ path = "new.txt", mode = "0644", content-hex = "6f6c64" }]
outcome = "error"
failure-category = "destination-conflict"
error = "destination exists"

[[negative]]
id = "file-text-no-change-error"
family = "file-text"
operation = { type = "file-search-replace", file = "*.conf", regex = "missing", replacement = "new" }
input-files = [{ path = "app.conf", mode = "0644", content-hex = "6b65793d76616c75650a" }]
outcome = "error"
failure-category = "no-change"
error = "no changed file"

[[negative]]
id = "file-text-crlf-normalized-before-match-error"
family = "file-text"
operation = { type = "file-search-replace", file = "*.conf", regex = "\\r", replacement = "" }
input-files = [{ path = "app.conf", mode = "0644", content-hex = "6b65793d76616c75650d0a" }]
expected-preserved-content-hex = "6b65793d76616c75650d0a"
outcome = "error"
failure-category = "no-change"
error = "CRLF normalized before matching"

[[negative]]
id = "spec-replacement-bare-cr-error"
family = "spec-text"
operation = { type = "spec-search-replace", regex = "example", replacement = "\r" }
input-lines = ["Name: example"]
outcome = "error"
failure-category = "text-line-ending"
error = "replacement cannot introduce bare CR"

[[negative]]
id = "duplicate-package-preamble-error"
family = "spec-tag"
operation = { type = "spec-add-tag", package = "devel", tag = "Vendor", value = "Azure Linux" }
input-lines = [
  "Name: example",
  "%package devel",
  "Summary: Development",
  "%package -n devel",
  "Summary: Duplicate",
]
outcome = "error"
failure-category = "rpm-model"
error = "duplicate package preamble selector identity"

[[negative]]
id = "patch-add-explicit-slot-collision-error"
family = "patch"
operation = { type = "patch-add", source = "patches/new.patch", file = "new.patch" }
input-lines = ["Name: example", "Patch0: one.patch", "Patch00: two.patch"]
input-files = []
outcome = "error"
failure-category = "patch-numbering"
error = "duplicate patch slot"

[[negative]]
id = "patch-add-slot-overflow-error"
family = "patch"
operation = { type = "patch-add", source = "patches/new.patch", file = "new.patch" }
input-lines = ["Name: example", "Patch2147483647: last.patch"]
input-files = []
outcome = "error"
failure-category = "patch-numbering"
error = "patch slot overflow"

[[negative]]
id = "patch-add-invalid-suffix-error"
family = "patch"
operation = { type = "patch-add", source = "patches/new.patch", file = "new.patch" }
input-lines = ["Name: example", "PatchNext: old.patch"]
input-files = []
outcome = "error"
failure-category = "patch-numbering"
error = "invalid Patch suffix"
