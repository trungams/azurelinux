[[authority-cases]]
name = "DNS case and default port canonicalize"
uri = "https://EXAMPLE.invalid:443/a?b=1"
expected = "valid"
canonical-origin = "https://example.invalid"
canonical-uri = "https://example.invalid/a?b=1"
host = "example.invalid"
tls-server-name = "example.invalid"
tls-peer-name = "example.invalid"

[[authority-cases]]
