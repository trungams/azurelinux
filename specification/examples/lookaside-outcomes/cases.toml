hash = "1ef851f452bffe3090ca569b8aa10813d3cec356e90e6e1462306bce1c0e3f15"
requests = [
  { http-version = "HTTP/1.1", method = "GET", uri = "https://keys.example.invalid/repository.gpg", request-target = "/repository.gpg", host = "keys.example.invalid", tls-server-name = "keys.example.invalid", tls-peer-name = "keys.example.invalid", body-hex = "", trailers = [], headers = [{ name = "Accept", value = "*/*" }, { name = "Accept-Encoding", value = "identity" }] },
]
