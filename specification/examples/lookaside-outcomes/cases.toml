[[shared-fetch-cases]]
name = "cross-origin redirect reconstructs request without authorization"
request-kind = "lookaside"
covers = ["shared-state", "request-contract"]
start-uri = "https://lookaside.example.invalid/private/a"
credential-reference = "credential-ref:lookaside"
credential-origin = "https://lookaside.example.invalid"
hash-type = "SHA256"
hash = "537458d51902f95dad749119118cbe8841a3f81d53ab4c1c53e94d96a13a547f"
requests = [
  { http-version = "HTTP/1.1", method = "GET", uri = "https://lookaside.example.invalid/private/a", request-target = "/private/a", host = "lookaside.example.invalid", tls-server-name = "lookaside.example.invalid", tls-peer-name = "lookaside.example.invalid", body-hex = "", trailers = [], headers = [{ name = "Accept", value = "*/*" }, { name = "Accept-Encoding", value = "identity" }, { name = "Authorization", credential-reference = "credential-ref:lookaside" }] },
  { http-version = "HTTP/1.1", method = "GET", uri = "https://cdn.example.invalid/public/a", request-target = "/public/a", host = "cdn.example.invalid", tls-server-name = "cdn.example.invalid", tls-peer-name = "cdn.example.invalid", body-hex = "", trailers = [], headers = [{ name = "Accept", value = "*/*" }, { name = "Accept-Encoding", value = "identity" }] },
]
responses = [
  { status = 302, location = "https://cdn.example.invalid/public/a" },
  { status = 200, body-complete = true, body-hex = "63726f73732d6f726967696e2d6279746573" },
]
expected = "hit"
expected-final-uri = "https://cdn.example.invalid/public/a"

[[shared-fetch-cases]]
