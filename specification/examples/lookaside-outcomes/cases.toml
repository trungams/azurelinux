[[cases]]
name = "upstream manifest hit"
artifact = "upstream-manifest"
component = "upstream"
outcome = "hit"
digest-matches = true
expected = "accept"

[[cases]]
name = "upstream manifest missing is terminal"
artifact = "upstream-manifest"
component = "upstream"
outcome = "not-found"
expected = "error"

[[cases]]
name = "configured upstream miss falls back"
artifact = "configured-download"
component = "upstream"
outcome = "not-found"
disable-origins = false
expected = "origin"

[[cases]]
name = "configured upstream miss with origins disabled"
artifact = "configured-download"
component = "upstream"
outcome = "not-found"
disable-origins = true
expected = "error"

[[cases]]
name = "authorization failure is terminal"
artifact = "configured-download"
component = "upstream"
outcome = "authorization-failure"
disable-origins = false
expected = "error"

[[cases]]
name = "TLS failure is terminal"
artifact = "configured-download"
component = "upstream"
outcome = "tls-failure"
disable-origins = false
expected = "error"

[[cases]]
name = "transport failure is terminal"
artifact = "configured-download"
component = "upstream"
outcome = "transport-failure"
disable-origins = false
expected = "error"

[[cases]]
name = "malformed response is terminal"
artifact = "configured-download"
component = "upstream"
outcome = "malformed-response"
disable-origins = false
expected = "error"

[[cases]]
name = "integrity failure is terminal"
artifact = "configured-download"
component = "upstream"
outcome = "integrity-failure"
disable-origins = false
expected = "error"

[[cases]]
name = "local configured download skips lookaside"
artifact = "configured-download"
component = "local"
outcome = "not-attempted"
expected = "origin"

[[selection-cases]]
name = "lookaside miss permits successful origin"
lookaside-outcome = "not-found"
disable-origins = false
origin-outcome = "hit"
expected = "accept"

[[selection-cases]]
name = "origin not-found is terminal"
lookaside-outcome = "not-found"
disable-origins = false
origin-outcome = "not-found"
expected = "error"

[[selection-cases]]
name = "origin transport failure is terminal"
lookaside-outcome = "not-found"
disable-origins = false
origin-outcome = "transport-failure"
expected = "error"

[[selection-cases]]
name = "lookaside transport failure forbids origin"
lookaside-outcome = "transport-failure"
disable-origins = false
origin-outcome = "hit"
expected = "error"

[[http-cases]]
name = "direct complete 200 is a hit"
start-uri = "https://lookaside.example.invalid/objects/a"
responses = [{ status = 200, body-complete = true }]
expected = "hit"
expected-final-uri = "https://lookaside.example.invalid/objects/a"

[[http-cases]]
name = "relative redirect resolves before final not-found"
start-uri = "https://lookaside.example.invalid/objects/pkg/source"
responses = [
  { status = 302, location = "../missing" },
  { status = 404 },
]
expected = "not-found"
expected-final-uri = "https://lookaside.example.invalid/objects/missing"

[[http-cases]]
name = "absolute HTTPS redirect can reach a hit"
start-uri = "https://lookaside.example.invalid/objects/a"
responses = [
  { status = 308, location = "https://cdn.example.invalid/object/a" },
  { status = 200, body-complete = true },
]
expected = "hit"
expected-final-uri = "https://cdn.example.invalid/object/a"

[[http-cases]]
name = "ten redirects are permitted"
start-uri = "https://lookaside.example.invalid/start"
redirect-count = 10
final-status = 200
expected = "hit"

[[http-cases]]
name = "eleventh redirect exceeds hop cap"
start-uri = "https://lookaside.example.invalid/start"
redirect-count = 11
final-status = 200
expected = "transport-failure"

[[http-cases]]
name = "redirect loop is transport failure"
start-uri = "https://lookaside.example.invalid/a"
responses = [
  { status = 301, location = "/b" },
  { status = 302, location = "/a" },
]
expected = "transport-failure"

[[http-cases]]
name = "authority alias is one redirect-loop identity"
start-uri = "https://EXAMPLE.invalid:443/a"
responses = [
  { status = 302, location = "https://example.invalid/a" },
]
expected = "transport-failure"

[[http-cases]]
name = "missing Location is malformed"
start-uri = "https://lookaside.example.invalid/a"
responses = [{ status = 302 }]
expected = "malformed-response"

[[http-cases]]
name = "duplicate Location is malformed"
start-uri = "https://lookaside.example.invalid/a"
responses = [{ status = 307, locations = ["/b", "/c"] }]
expected = "malformed-response"

[[http-cases]]
name = "malformed Location is malformed response"
start-uri = "https://lookaside.example.invalid/a"
responses = [{ status = 302, location = "https://[invalid" }]
expected = "malformed-response"

[[http-cases]]
name = "non-HTTPS redirect is transport failure"
start-uri = "https://lookaside.example.invalid/a"
responses = [{ status = 302, location = "http://lookaside.example.invalid/b" }]
expected = "transport-failure"

[[http-cases]]
name = "authorization status is classified"
start-uri = "https://lookaside.example.invalid/a"
responses = [{ status = 403 }]
expected = "authorization-failure"

[[http-cases]]
name = "gone status is not-found"
start-uri = "https://lookaside.example.invalid/a"
responses = [{ status = 410 }]
expected = "not-found"

[[http-cases]]
name = "other success status is transport failure"
start-uri = "https://lookaside.example.invalid/a"
responses = [{ status = 204, body-complete = true }]
expected = "transport-failure"

[[http-cases]]
name = "unrecognized redirect is transport failure"
start-uri = "https://lookaside.example.invalid/a"
responses = [{ status = 304, location = "/b" }]
expected = "transport-failure"

[[http-cases]]
name = "server error is transport failure"
start-uri = "https://lookaside.example.invalid/a"
responses = [{ status = 500 }]
expected = "transport-failure"

[[http-cases]]
name = "incomplete 200 response is malformed"
start-uri = "https://lookaside.example.invalid/a"
responses = [{ status = 200, body-complete = false }]
expected = "malformed-response"

[[shared-fetch-cases]]
name = "lookaside hashes exact representation octets"
request-kind = "lookaside"
covers = ["shared-state", "bytes"]
start-uri = "https://lookaside.example.invalid/objects/a"
hash-type = "SHA256"
hash = "f6f13ead9c228297211b44bf931167bba3794675ab97487dd3c767523faed326"
requests = [
  { http-version = "HTTP/1.1", method = "GET", uri = "https://lookaside.example.invalid/objects/a", request-target = "/objects/a", host = "lookaside.example.invalid", tls-server-name = "lookaside.example.invalid", tls-peer-name = "lookaside.example.invalid", body-hex = "", trailers = [], headers = [{ name = "Accept", value = "*/*" }, { name = "Accept-Encoding", value = "identity" }] },
]
responses = [
  { status = 200, body-complete = true, body-hex = "6c6f6f6b61736964652d6279746573" },
]
expected = "hit"

[[shared-fetch-cases]]
name = "origin uses redirects and explicit identity coding"
request-kind = "origin"
covers = ["shared-state", "bytes"]
start-uri = "https://origin.example.invalid/files/a"
hash-type = "SHA256"
hash = "5f75732a438ad56f5fb59b3dee7d1af8e6722575107f2ee06028230d5af40b8a"
requests = [
  { http-version = "HTTP/1.1", method = "GET", uri = "https://origin.example.invalid/files/a", request-target = "/files/a", host = "origin.example.invalid", tls-server-name = "origin.example.invalid", tls-peer-name = "origin.example.invalid", body-hex = "", trailers = [], headers = [{ name = "Accept", value = "*/*" }, { name = "Accept-Encoding", value = "identity" }] },
  { http-version = "HTTP/1.1", method = "GET", uri = "https://origin.example.invalid/objects/a", request-target = "/objects/a", host = "origin.example.invalid", tls-server-name = "origin.example.invalid", tls-peer-name = "origin.example.invalid", body-hex = "", trailers = [], headers = [{ name = "Accept", value = "*/*" }, { name = "Accept-Encoding", value = "identity" }] },
]
responses = [
  { status = 302, location = "../objects/a" },
  { status = 200, body-complete = true, content-encoding = "\tIdEnTiTy ", body-hex = "6f726967696e2d6279746573" },
]
expected = "hit"
expected-final-uri = "https://origin.example.invalid/objects/a"

