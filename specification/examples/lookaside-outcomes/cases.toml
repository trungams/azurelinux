tls-server-name = "example.invalid"
tls-peer-name = "example.invalid"

[[authority-cases]]
name = "percent-encoded reg-name is forbidden"
uri = "https://%65xample.invalid/a"
expected = "invalid"

[[authority-cases]]
name = "Unicode IDN U-label is forbidden"
