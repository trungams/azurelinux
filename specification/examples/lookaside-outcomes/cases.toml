[[shared-fetch-cases]]
name = "remote repository key redirect uses shared state machine"
request-kind = "repository-gpg-key"
covers = ["repository-key", "request-contract", "bytes"]
start-uri = "https://KEYS.example.invalid:443/repository.gpg"
hash-type = "SHA256"
hash = "1ef851f452bffe3090ca569b8aa10813d3cec356e90e6e1462306bce1c0e3f15"
requests = [
  { http-version = "HTTP/1.1", method = "GET", uri = "https://keys.example.invalid/repository.gpg", request-target = "/repository.gpg", host = "keys.example.invalid", tls-server-name = "keys.example.invalid", tls-peer-name = "keys.example.invalid", body-hex = "", trailers = [], headers = [{ name = "Accept", value = "*/*" }, { name = "Accept-Encoding", value = "identity" }] },
  { http-version = "HTTP/1.1", method = "GET", uri = "https://cdn.keys.example.invalid/releases/repository.gpg", request-target = "/releases/repository.gpg", host = "cdn.keys.example.invalid", tls-server-name = "cdn.keys.example.invalid", tls-peer-name = "cdn.keys.example.invalid", body-hex = "", trailers = [], headers = [{ name = "Accept", value = "*/*" }, { name = "Accept-Encoding", value = "identity" }] },
]
responses = [
  { status = 302, location = "https://cdn.keys.example.invalid:443/releases/repository.gpg" },
  { status = 200, body-complete = true, body-hex = "666978747572652d6f70656e7067702d6b65792d76310a" },
]
expected = "hit"
expected-final-uri = "https://cdn.keys.example.invalid/releases/repository.gpg"

[[shared-fetch-cases]]
