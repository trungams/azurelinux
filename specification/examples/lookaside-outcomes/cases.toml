requests = [
  { http-version = "HTTP/1.1", method = "GET", uri = "https://example.invalid/a", request-target = "/a", host = "example.invalid", tls-server-name = "example.invalid", tls-peer-name = "example.invalid", body-hex = "", trailers = [], headers = [{ name = "Accept", value = "*/*" }, { name = "Accept-Encoding", value = "identity" }, { name = "Authorization", credential-reference = "credential-ref:origin" }] },
  { http-version = "HTTP/1.1", method = "GET", uri = "https://example.invalid/b", request-target = "/b", host = "example.invalid", tls-server-name = "example.invalid", tls-peer-name = "example.invalid", body-hex = "", trailers = [], headers = [{ name = "Accept", value = "*/*" }, { name = "Accept-Encoding", value = "identity" }, { name = "Authorization", credential-reference = "credential-ref:origin" }] },
]
