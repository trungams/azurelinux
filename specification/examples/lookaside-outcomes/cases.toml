canonical-uri = "https://xn--bcher-kva.example/a"
host = "xn--bcher-kva.example"
tls-server-name = "xn--bcher-kva.example"
tls-peer-name = "xn--bcher-kva.example"

[[authority-cases]]
name = "IPv6 text and default port canonicalize"
uri = "https://[2001:0DB8:0:0:0:0:0:1]:443/a"
