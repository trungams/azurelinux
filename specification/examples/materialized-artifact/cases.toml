[[invalid]]
name = "hardlink is forbidden"
entry = { path = "alias", type = "hardlink", target = "example.spec" }
failure-category = "unsupported-type"
error = "unsupported entry type"

[[invalid]]
name = "absolute symlink target is forbidden"
entry = { path = "outside", type = "symlink", target = "/etc/passwd" }
failure-category = "symlink-target"
error = "non-relative symlink target"

[[invalid]]
name = "tree symlink escapes"
entry = { path = "dir/outside", type = "symlink", target = "../../outside" }
failure-category = "symlink-target"
error = "escaping symlink target"

[[invalid]]
name = "tree symlink target is empty"
entry = { path = "dir/outside", type = "symlink", target = "" }
failure-category = "symlink-target"
error = "empty symlink target"

[[invalid]]
name = "tree symlink target uses backslash"
entry = { path = "dir/outside", type = "symlink", target = "..\\outside" }
failure-category = "symlink-target"
error = "backslash symlink target"

[[invalid]]
name = "tree symlink target uses drive prefix"
entry = { path = "dir/outside", type = "symlink", target = "C:/outside" }
failure-category = "symlink-target"
error = "drive-prefix symlink target"

[[invalid]]
name = "empty directory is excluded"
entry = { path = "empty", type = "directory", mode = "0755" }
descendants = []
failure-category = "empty-directory"
error = "empty directory"

[[invalid]]
name = "implementation marker is forbidden"
entry = { path = "RENDER_FAILED", type = "file", mode = "0644", content-hex = "6661696c6564" }
origin = "implementation-generated"
failure-category = "generated-entry"
error = "generated marker"

[[invalid]]
name = "artifact digest and sources record disagree"
entry = { path = "source.tar.gz", type = "file", mode = "0644", content-hex = "646966666572656e74" }
sources-record-hash = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
failure-category = "manifest-integrity"
error = "stale sources record"

[[invalid]]
name = "failed staged transform preserves prior publication"
prior-manifest = "input.manifest"
staged-manifest = "expected.manifest"
failure = "post-overlay hash mismatch"
expected-published-manifest = "input.manifest"
failure-category = "atomic-publication"
error = "no partial publication"
