[[configured-source-invalid]]
name = "dot filename cannot be emitted"
filename = "."
validation-stage = "SD-MODEL"
failure-category = "source-filename"

[[configured-source-invalid]]
name = "dotdot filename cannot be emitted"
filename = ".."
