[[case]]
category = "duplicate-literals"
root = "azldev.toml"
nodes = [
  { canonical = "azldev.toml", body = [], edges = [
    { entry = "common.toml", canonical = "common.toml" },
    { entry = "common.toml", canonical = "common.toml" },
  ] },
  { canonical = "common.toml", body = ["shared-body"], edges = [
    { entry = "leaf.toml", canonical = "leaf.toml" },
  ] },
  { canonical = "leaf.toml", body = ["observable-descendant"], edges = [] },
]
expected-reach-order = ["common.toml", "leaf.toml", "common.toml"]
expected-body-order = ["shared-body", "observable-descendant"]
expected-contributions = ["shared-body", "observable-descendant"]

