[[cases]]
id = "ambient-projection-positive"
kind = "positive"
class = "Source-document"
role = "producer"
profile = "core"
claimable = false
blocked-by = []
operation = "none"
environment = {}
expected-outcome = "success"

[cases.case-input]
class = "Source-document"
document-role = "root"
project-root = "input:inputs/project-root.manifest.toml"
document-target = "input:inputs/document-target.toml"
document-bytes = "input:inputs/source-root.toml"

[[cases.environment-assertions]]
row-id = "ENV-LOCALE"
expectation = "fixed-rule"

[[cases.environment-assertions]]
row-id = "ENV-TIMEZONE"
expectation = "fixed-rule"

[[cases.environment-assertions]]
row-id = "ENV-AMBIENT-WALL-CLOCK"
expectation = "prohibited-unobserved"

[[cases.environment-assertions]]
row-id = "ENV-HOST-ARCHITECTURE"
expectation = "prohibited-unobserved"

[[cases.environment-assertions]]
row-id = "ENV-UMASK"
expectation = "fixed-rule"

[[cases.expected-positive]]
requirement = "determinism.md#locale-timezone-and-wall-clock"
subject = "ambient-locale-time-independence"
fact = "identical-projection"

