[[inputs]]
path = "inputs/source-root.toml"
sha256 = "67d9d8dafce2af2323efab35116e112886811d43bfb3b1526aea55d06dd78272"

[[inputs]]
path = "inputs/invalid-source.toml"
sha256 = "717e17fd85c56b0159d0ebfb8c84ef5a8e9c327a9bb3624b876f760e68922db3"

[[cases]]
id = "source-document-positive"
kind = "positive"
class = "Source-document"
expected-outcome = "success"

[cases.case-input]
class = "Source-document"
document-role = "root"
project-relative-path = "azldev.toml"
