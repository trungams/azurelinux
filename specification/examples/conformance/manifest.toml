[[cases.expected-facts]]
requirement = "loading.md#root-discovery-and-project-root"
subject = "slice4-fixture-project:azldev.toml"
fact = "root-document-bound"

[[cases]]
id = "unknown-root-key-negative"
kind = "negative"
class = "Source-document"
expected-outcome = "error"

[cases.case-input]
class = "Source-document"
document-role = "root"
project-relative-path = "azldev.toml"
document-bytes = "input:inputs/invalid-source.toml"

[[cases.expected-diagnostics]]
class = "model-validation"
validation-phase = "V-DOCUMENT"
processing-phase = "SD-MODEL"
requirement = "document.md#strict-key-vocabulary"
subject = "unknown-root-key"
