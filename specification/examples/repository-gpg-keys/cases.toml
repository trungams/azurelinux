format-version = 1
repository-input-manifest = "repository-input.manifest.toml"
repository-input-manifest-sha256 = "86d1ba6bfff0821ab5b40e972a18235368f89aafb6ac3ed0b5646e6230fceed3"

[[cases]]
name = "remote key redirect is verified before repository use"
operation = "rpm-build"
repository = "fixture-remote"
gpg-key = "https://KEYS.example.invalid:443/repository.gpg"
source = "remote"
canonical-uri = "https://keys.example.invalid/repository.gpg"
sha256 = "1ef851f452bffe3090ca569b8aa10813d3cec356e90e6e1462306bce1c0e3f15"
shared-fetch-case = "remote repository key redirect uses shared state machine"
expected = "binding-ready"
key-acceptance-owner = "selected-package-manager"
repository-accessed = false

[[cases]]
name = "remote key replacement fails before repository use"
operation = "rpm-build"
repository = "fixture-remote"
gpg-key = "https://KEYS.example.invalid:443/repository.gpg"
source = "remote"
canonical-uri = "https://keys.example.invalid/repository.gpg"
sha256 = "1ef851f452bffe3090ca569b8aa10813d3cec356e90e6e1462306bce1c0e3f15"
shared-fetch-case = "remote repository key replacement fails digest"
expected = "integrity-failure"
repository-accessed = false

[[cases]]
name = "local project key is snapshotted with provenance"
operation = "image-build"
repository = "fixture-local"
gpg-key = "keys/repository.gpg"
source = "local"
defining-document = "project:azldev.toml"
portable-path = "keys/repository.gpg"
sha256 = "1ef851f452bffe3090ca569b8aa10813d3cec356e90e6e1462306bce1c0e3f15"
snapshot-before-repository-access = true
snapshot-sha256-verified = true
expected = "binding-ready"
key-acceptance-owner = "selected-package-manager"
repository-accessed = false

[[diagnostic-cases]]
name = "missing selected repository binding"
defect = "missing"
operation = "rpm-build"
repository = "fixture-remote"
selected-repositories = ["fixture-remote", "fixture-local"]
expected-class = "unsupported-operation"
expected-validation-phase = "V-OPERATION"
expected-processing-phase = "rpm-build"
expected-requirement = "REPO-GPG-BINDING-MISSING"
repository-accessed = false

[[diagnostic-cases]]
name = "duplicate repository binding"
defect = "duplicate"
operation = "rpm-build"
repository = "fixture-remote"
selected-repositories = ["fixture-remote", "fixture-local"]
expected-class = "conflict"
expected-validation-phase = "V-OPERATION"
expected-processing-phase = "rpm-build"
expected-requirement = "REPO-GPG-BINDING-DUPLICATE"
repository-accessed = false

[[diagnostic-cases]]
name = "binding for unselected repository"
