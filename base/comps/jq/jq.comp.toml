[components.jq]

# The upstream jq spec runs its test suite under valgrind in %check. Azure
# Linux drops the test suite for this component via a declarative
# customization, which removes the %check section from the rendered spec
# entirely (as opposed to build.check.skip, which injects a skip guard). This
# demonstrates the tests customization end-to-end.
[[components.jq.customizations]]
type = "tests"
description = "Disable the jq test suite — removes %check from the rendered spec"
enabled = false
