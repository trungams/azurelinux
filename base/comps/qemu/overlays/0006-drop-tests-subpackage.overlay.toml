# Drop tests subpackage.
# qemu-tests ships per-arch test binaries, qemu-iotests fixture images, and
# related artefacts that trip the automated package-signing pipeline's
# FS-aware deep scanner. The subpackage is test-only and not shipped in any
# Azure Linux image, so we drop it entirely.
#
# Implementation notes:
# * `%define testsdir` lives inside the removed `%package tests` block but
#   is referenced from `%install`; spec-remove-subpackage preserves the
#   required macro automatically.
# * The `%install` section still writes test artefacts under `%{testsdir}`
#   and builds `accel-qtest-*.so` plugins, so we rm them from the buildroot
#   after install to avoid "Installed (but unpackaged)" errors.

metadata = { category = "azl-pruning", upstream-status = "inapplicable" }

overlays = [
    {
        description = 'Remove qemu-tests subpackage (test-only payload trips signing-pipeline deep scanner; not shipped in any Azure Linux image)',
        type = 'spec-remove-subpackage',
        package = 'tests',
    },
    {
        description = 'Drop test artefacts from buildroot after install (paired with qemu-tests subpackage removal)',
        type = 'spec-append-lines',
        section = '%install',
        lines = ['# Azure Linux: qemu-tests subpackage removed; drop its payload from buildroot.', 'rm -rf %{buildroot}%{testsdir}', 'rm -f %{buildroot}%{_libdir}/%{name}/accel-qtest-*.so'],
    },
]
