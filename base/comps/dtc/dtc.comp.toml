[components.dtc]

# Azure Linux does not ship mingw cross-compilation toolchains.
# The upstream spec hard-codes `%global with_mingw 1` whenever %fedora is
# defined (true in our build environment) rather than gating on a %bcond, so
# the standard `build.without = ["mingw"]` mechanism has no effect. The
# declarative `customize-build-option` customization normalizes both the
# `%global with_mingw` and `%bcond` forms, baking the disabled state into the
# rendered spec (replacing the previous spec-search-replace overlay).
[[components.dtc.customizations]]
type = "customize-build-option"
description = "Disable mingw sub-packages — Azure Linux does not ship mingw toolchains"
option = "mingw"
enabled = false
