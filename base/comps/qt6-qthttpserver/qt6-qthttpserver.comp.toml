[components.qt6-qthttpserver]

# Relax the exact BuildRequires pin on qt6-qtbase-private-devel from
# `= %{version}` to `>= %{version}`.
#
# In the stage-1 bootstrap the buildroot is populated from upstream Fedora,
# which may have moved qt6 on to a newer patch release (e.g. 6.10.3) while
# qt6-qthttpserver is still frozen at 6.10.2. The exact pin then fails its
# buildroot install ("No match for argument: qt6-qtbase-private-devel = 6.10.2")
# because Fedora only ships the newer private-devel subpackage. Relaxing it to
# `>=` aligns with qt6-qtconnectivity and the other qt6 modules.
#
# This uses the declarative customize-dependency customization (set-constraint)
# instead of a spec-search-replace overlay: the engine finds the BuildRequires
# atom by name and changes only its operator, preserving the %{version} EVR.
[[components.qt6-qthttpserver.customizations]]
type = "customize-dependency"
description = "Relax qt6-qtbase-private-devel from '= %{version}' to '>= %{version}' for Qt patch bumps"
action = "set-constraint"
relationship = "buildrequires"
name = "qt6-qtbase-private-devel"
op = ">="
